<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authentication // DevPortfolio Dark</title>
  <link rel="stylesheet" href="style.css">
  <script src="auth.js" defer></script>
</head>
<body style="justify-content: center; align-items: center; padding: 20px 0;">

  <div class="auth-wrapper">
    <div class="window-header">
      <span class="dot dot-red"></span>
      <span class="dot dot-yellow"></span>
      <span class="dot dot-green"></span>
      <span class="window-title">auth-gateway // session</span>
    </div>

    <div class="auth-tabs">
      <button class="auth-tab-btn active" id="tabLoginBtn" type="button">Sign In</button>
      <button class="auth-tab-btn" id="tabRegisterBtn" type="button">Register</button>
    </div>

    <div class="auth-body">
      <div id="authAlert" class="alert"></div>

      <!-- Login Form -->
      <form id="loginForm">
        <div class="form-group">
          <label for="loginEmail">Email Address</label>
          <input type="email" id="loginEmail" class="form-control" required placeholder="student@example.com">
        </div>
        <div class="form-group">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" class="form-control" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn-submit" style="margin-top: 10px;">Sign In to Console ➔</button>
      </form>

      <!-- Register Form -->
      <form id="registerForm" style="display: none;">
        <div class="form-group">
          <label for="regName">Full Name *</label>
          <input type="text" id="regName" class="form-control" required placeholder="e.g. John Doe">
        </div>
        <div class="form-group">
          <label for="regRoll">Roll Number / Reg ID</label>
          <input type="text" id="regRoll" class="form-control" placeholder="26CSM99">
        </div>
        <div class="form-group">
          <label for="regCourse">Course / Program</label>
          <input type="text" id="regCourse" class="form-control" value="B.Sc. Computer Science and Mathematics">
        </div>
        <div class="form-group">
          <label for="regInstitution">University / College</label>
          <input type="text" id="regInstitution" class="form-control" value="Kristu Jayanti (Deemed to be University)">
        </div>
        <div class="form-group">
          <label for="regEmail">Email Address *</label>
          <input type="email" id="regEmail" class="form-control" required placeholder="john.doe@example.com">
        </div>
        <div class="form-group">
          <label for="regPassword">Password (Min 8 Characters) *</label>
          <input type="password" id="regPassword" class="form-control" required placeholder="••••••••">
        </div>
        <div class="form-group">
          <label for="regConfirmPassword">Confirm Password *</label>
          <input type="password" id="regConfirmPassword" class="form-control" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn-submit" style="margin-top: 10px;">Create Student Account ➔</button>
      </form>

      <div style="text-align: center; margin-top: 18px; font-size: 0.82rem;">
        <a href="/" style="color: var(--text-muted);">&larr; Return to Public Dashboard</a>
      </div>
    </div>
  </div>

</body>
</html>
